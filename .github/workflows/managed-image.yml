name: Managed image

on:
  push:
    branches: [codex/plan-limits]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile.managed
          push: true
          platforms: linux/amd64
          tags: ghcr.io/smsflow-za/whatomate:managed-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: ghcr.io/smsflow-za/whatomate@%s\nSource: https://github.com/SMSFlow-ZA/whatomate/commit/%s\n' "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
