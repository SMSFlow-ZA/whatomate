name: Managed image

on:
  push:
    branches: [codex/plan-limits, codex/instance-branding, codex/production-hardening, codex/channels-smsflow-20261019, codex/webhook-signing-20261027]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verification:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  image:
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile.managed
          push: true
          platforms: linux/amd64
          tags: ghcr.io/smsflow-za/whatomate:managed-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: ghcr.io/smsflow-za/whatomate@%s\nSource: https://github.com/SMSFlow-ZA/whatomate/commit/%s\n' "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Export deployment image without registry credentials
        run: |
          docker pull "ghcr.io/smsflow-za/whatomate:managed-$GITHUB_SHA"
          docker save --output whatomate-image.tar "ghcr.io/smsflow-za/whatomate:managed-$GITHUB_SHA"
          sha256sum whatomate-image.tar > whatomate-image.tar.sha256
          printf '%s\n' "$GITHUB_SHA" > source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: managed-runtime
          path: |
            whatomate-image.tar
            whatomate-image.tar.sha256
            source-revision.txt
          retention-days: 7
